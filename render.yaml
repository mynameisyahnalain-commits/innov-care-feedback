services:
  - type: web
    name: innov-care-feedback
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: innov-care-2026
      - key: SUPER_ADMIN_PASSWORD
        value: innov-super-2026
      - key: DB_STORAGE_LIMIT_BYTES
        value: "8589934592"
